# =============================================================================
# CREMA-D R1/R2/R3 frozen config (per PREREGISTRATION_CREMAD.md).
# Hyperparameters fixed BEFORE the final runs / before inspecting test results.
# =============================================================================
experiment: cremad_r1r2r3

seed_policy:
  seeds: [0, 1, 2, 3, 4]        # >=5 per preregistration
  deterministic: true

device:
  type: cuda
  allow_cpu: false

data:
  n_classes: 6                  # emotions ANG/DIS/FEA/HAP/NEU/SAD
  cache_dir: data/cremad/cache

model:
  rep_dim: 64
  fusion: sum                   # PRIMARY (concat is a preregistered secondary; deferred)
  head: linear

train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0

r3:
  # frozen: multiply one modality by c and the RECIPROCAL on the other, on the
  # FIXED trained reps (alpha_audio=c, alpha_video=1/c). c<1 => video-favored,
  # c>1 => audio-favored -> both modality directions covered by the c range.
  scale_factors: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]

output:
  root: results/cremad
