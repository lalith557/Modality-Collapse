experiment: utd_mhad_scale
seed_policy:
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  deterministic: true
device:
  type: cuda
  allow_cpu: false
data:
  n_classes: 27
  raw_dir: ../UTD-MHAD
  cache_dir: data/utd_mhad/cache
  split:
    train:
    - 1
    - 3
    - 5
    val:
    - 7
    test:
    - 2
    - 4
    - 6
    - 8
  depth:
    n_frames: 16
    hw: 32
  inertial:
    length: 128
    channels: 6
    train_mean: null
    train_std: null
model:
  rep_dim: 64
  fusion: sum
  head: linear
train:
  epochs: 60
  batch_size: 32
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
output:
  root: results/utd_mhad
studio:
  seed: 0
  arm: baseline
  source_config: configs/utd_mhad.yaml
